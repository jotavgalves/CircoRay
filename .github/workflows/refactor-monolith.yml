name: Refactor monolith

on:
  push:
    branches:
      - refactor/admin-config
    paths:
      - '.github/workflows/refactor-monolith.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: refactor/admin-config
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract legacy CSS and JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('index.html')
          source = page.read_text(encoding='utf-8')

          styles = list(re.finditer(r'<style(?P<attrs>[^>]*)>(?P<body>.*?)</style>', source, re.I | re.S))
          if not styles:
              raise SystemExit('No inline <style> block found')
          style = max(styles, key=lambda m: len(m.group('body')))

          scripts = [
              m for m in re.finditer(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>', source, re.I | re.S)
              if 'src=' not in m.group('attrs').lower() and m.group('body').strip()
          ]
          if not scripts:
              raise SystemExit('No inline executable <script> block found')
          script = max(scripts, key=lambda m: len(m.group('body')))

          css = style.group('body').strip() + '\n'
          js = script.group('body').strip() + '\n'
          if len(css) < 10000:
              raise SystemExit(f'Largest style block unexpectedly small: {len(css)} bytes')
          if len(js) < 10000:
              raise SystemExit(f'Largest script block unexpectedly small: {len(js)} bytes')

          Path('assets/css').mkdir(parents=True, exist_ok=True)
          Path('assets/js').mkdir(parents=True, exist_ok=True)
          Path('assets/css/game-legacy.css').write_text(css, encoding='utf-8')
          Path('assets/js/game-legacy.js').write_text(js, encoding='utf-8')

          replacements = [
              (style.start(), style.end(), '<link rel="stylesheet" href="./assets/css/game-legacy.css">'),
              (script.start(), script.end(), '<script src="./assets/js/game-legacy.js" defer></script>'),
          ]
          for start, end, replacement in sorted(replacements, reverse=True):
              source = source[:start] + replacement + source[end:]

          page.write_text(source, encoding='utf-8')
          print(f'index.html: {len(source)} bytes')
          print(f'game-legacy.css: {len(css)} bytes')
          print(f'game-legacy.js: {len(js)} bytes')
          PY

          node --check assets/js/game-legacy.js

      - name: Remove obsolete workflows
        run: |
          rm -f .github/workflows/fix-audio-path.yml
          rm -f .github/workflows/refactor-monolith.yml

      - name: Commit structural extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Refactor: extract legacy CSS and JS from index'
          git push origin HEAD:refactor/admin-config
