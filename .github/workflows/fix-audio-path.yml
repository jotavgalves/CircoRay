name: Fix audio path

on:
  push:
    paths:
      - '.github/workflows/fix-audio-path.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix audio source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = './Trim_VtA_Twisted%20Carousel_1_1.mp3'
          new = './assets/audio/Trim_VtA_Twisted%20Carousel_1_1.mp3'
          if old not in s:
              raise SystemExit('Expected old audio path not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix background music asset path'
          git push
