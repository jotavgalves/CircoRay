<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" role="img" aria-labelledby="title desc">
  <title id="title">Palhaço Carmesim em seu guichê</title>
  <desc id="desc">Ilustração de um guichê de parque macabro com o Palhaço Carmesim ao centro.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160304"/>
      <stop offset=".55" stop-color="#260607"/>
      <stop offset="1" stop-color="#080202"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a160d"/>
      <stop offset=".18" stop-color="#6a321b"/>
      <stop offset=".5" stop-color="#3b1c10"/>
      <stop offset=".82" stop-color="#6b351d"/>
      <stop offset="1" stop-color="#26130b"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f1016"/>
      <stop offset="1" stop-color="#350305"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="48%">
      <stop offset="0" stop-color="#a00000" stop-opacity=".38"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".72"/>
    </filter>
    <filter id="redGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#b00000" flood-opacity=".58"/>
    </filter>
    <clipPath id="windowClip"><rect x="72" y="166" width="336" height="330" rx="10"/></clipPath>
  </defs>

  <rect width="480" height="720" rx="24" fill="#090202"/>
