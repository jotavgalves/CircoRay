  <rect x="24" y="24" width="432" height="672" rx="18" fill="none" stroke="#2a140a" stroke-width="8"/>
  <rect x="34" y="34" width="412" height="652" rx="16" fill="none" stroke="#9f1118" stroke-opacity=".32" stroke-width="2"/>

