<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" role="img" aria-labelledby="title desc">
  <title id="title">Palhaço irritado</title>
  <desc id="desc">Rosto de palhaço de circo sombrio com expressão agressiva, cabelo vermelho e maquiagem marcada.</desc>
  <defs>
    <radialGradient id="skin" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f1e3ce"/>
      <stop offset=".72" stop-color="#c9b69c"/>
      <stop offset="1" stop-color="#8d7762"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
